    <script>
      // Immediate Theme Check to prevent FOUC (Flash of Unstyled Content)
      // Checks localStorage first, then system preference
      (function() {
        try {
          const savedTheme = localStorage.getItem('theme');
          const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          
          if (savedTheme === 'dark' || (!savedTheme && sysDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {
          // Fallback to dark if anything fails
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Polyfill for process.env to prevent "process is not defined" crash in browser environments
      window.process = window.process || { env: { API_KEY: '' } };
      
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: 'var(--bg-background)',
              surface: 'var(--bg-surface)',
              primary: 'var(--color-primary)',
              secondary: 'var(--color-secondary)',
              textMain: 'var(--text-main)',
              textMuted: 'var(--text-muted)',
            },
            animation: {
              'blob': 'blob 7s infinite',
              'fade-in': 'fadeIn 1s ease-out forwards',
              'slide-up': 'slideUp 0.8s ease-out forwards',
              'scan': 'scan 3s linear infinite',
              'shimmer': 'shimmer 2s linear infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              scan: {
                '0%': { transform: 'translateY(-100%)' },
                '100%': { transform: 'translateY(100%)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              }
            }
          },
        },
      }
    </script>
    <style>
      :root {
        --bg-background: #ffffff;
        --bg-surface: #f3f4f6;
        --text-main: #000000;
        --text-muted: #4b5563;
        --color-primary: #000000;
        --color-secondary: #4b5563;
      }

      .dark {
        --bg-background: #000000;
        --bg-surface: #111111;
        --text-main: #ffffff;
        --text-muted: #9ca3af;
        --color-primary: #ffffff;
        --color-secondary: #9ca3af;
      }

      body {
        background-color: var(--bg-background);
        color: var(--text-main);
        transition: background-color 0.5s ease, color 0.5s ease;
      }

      /* Custom scrollbar for Webkit */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-background); 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }
    </style>
